name: Build Voidform
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCOPY_PLUGIN_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release --target Voidform_VST3 Voidform_Standalone --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Voidform-${{ matrix.os }}
          path: build/Voidform_artefacts/Release/VST3/Voidform.vst3
